{% extends 'base.html' %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p>Use your company email to access approvals.</p>
  <form method="post" class="form-grid">
    <label>Email
      <input type="email" name="email" required />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">Log in</button>
  </form>
  <small>Demo users: alice@company.com / alice123, manager1@company.com / manager123</small>
</section>
{% endblock %}
